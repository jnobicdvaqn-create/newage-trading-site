# Nginx reverse proxy config for NewAge Trading site
# Copy this to /etc/nginx/sites-available/ and symlink to sites-enabled/
# sudo ln -s /etc/nginx/sites-available/newage-trading.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name newagetrading.com www.newagetrading.com;

    # Serve static Astro build
    root /home/xinwen3046/openclaw/workspace/projects/newage-trading-site/dist;
    index index.html;

    # Reverse proxy for contact form API
    location /api/contact {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Limit request body size (prevent abuse)
        client_max_body_size 1m;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static files
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
